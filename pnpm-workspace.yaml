# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
# This setting requires any npm package version be published for at least 1 day
# before pnpm will install it. Defense against supply-chain attacks.
# DO NOT DISABLE. Use minimumReleaseAgeExclude for trusted packages only.
# ============================================================================
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync
  - concurrently
  - cross-env

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  concurrently: ^9.1.2
  cross-env: ^7.0.3
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

# Which packages are allowed to run install scripts (postinstall/build)
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

# Replit-specific optional packages: don't fail install if they're missing on Windows
ignoredOptionalDependencies:
  - '@replit/vite-plugin-cartographer'
  - '@replit/vite-plugin-dev-banner'
  - '@replit/vite-plugin-runtime-error-modal'

allowBuilds:
  esbuild: false
